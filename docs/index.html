<!DOCTYPE html>
<html>

<head>
    <title>Centopassi Planner</title>
    <style>
        /* Set the size of the map */
        #map {
            height: 100%;
            width: 80%;
            float: left;
            border-radius: 32px;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            margin: 0;
            display: flex;
            overflow: hidden;
        }

        .content {
            padding: 16px;
            height: 90%;
            width: 100%;
            display: flex;
        }

        #path-panel {
            height: 90vh;
            width: 20%;
            float: right;
            overflow-y: auto;
            background-color: #f8f9fa;
            border-left: 1px solid #ccc;
            padding: 10px;
        }

        #path-header {
            position: sticky;
            top: -10px;
            margin: -10px -10px 0 -10px;
            padding: 10px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #ccc;
            z-index: 100;
        }

        .path-item {
            padding: 5px;
            background-color: #e9ecef;
            border: 1px solid #ced4da;
            margin: 5px;
            cursor: grab;
        }

        .cursor {
            font-weight: 700;
        }

        .path-item:hover {
            background-color: #dee2e6;
        }

        .path-remove {
            float: right;
            color: red;
            cursor: pointer;
        }

        .leg-duration {
            margin-left: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #1565c0;
        }

        .leg-duration.leg-fast {
            color: #2e7d32;
        }

        .leg-duration.leg-slow {
            color: #c62828;
        }

        .skip-cost {
            margin-left: 10px;
            font-size: 13px;
            color: #000;
        }

        .skip-cost.skip-slow {
            color: #c62828;
        }

        .marker-tag {
            background-color: blue;
            color: white;
            font-weight: 600;
            height: 20px;
            width: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            transform: translate(0, 10px);
        }

        .marker-tag:hover {
            height: 24px;
            width: 24px;
            border-radius: 12px;
            transform: translate(0, 12px);
        }

        .marker-tag.gp_marker {
            background-color: red;
        }

        .marker-tag.fin_marker {
            background-color: black;
        }

        .marker-tag.old_marker {
            background-color: orange;
            height: 10px;
            width: 10px;
            transform: translate(0, 5px);
        }

        .marker-tag.annulled_marker {
            position: relative;
            opacity: 0.6;
        }

        .marker-tag.annulled_marker::before,
        .marker-tag.annulled_marker::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 140%;
            height: 3px;
            background-color: red;
            box-shadow: 0 0 2px white;
            pointer-events: none;
        }

        .marker-tag.annulled_marker::before {
            transform: translate(-50%, -50%) rotate(45deg);
        }

        .marker-tag.annulled_marker::after {
            transform: translate(-50%, -50%) rotate(-45deg);
        }

        .marker-tag.old_marker.track_marker {
            background-color: purple;
        }

        .marker-tag.gp_marker.marker_path {
            background-color: #ff8e8e !important;
            border: 3px solid white;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
            animation: pulse 1.5s infinite;
        }

        .marker-tag.marker_path:not(.gp_marker):not(.fin_marker):not(.old_marker) {
            background-color: #84b5ff !important;
            border: 3px solid white;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(255, 255, 255, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
            }
        }

        button {
            display: flex;
            align-items: center;
        }

        .marker-highlight {
            border: 3px solid #ffe066 !important;
            box-shadow: 0 0 12px 4px #ffe066 !important;
            z-index: 1000;
        }
    </style>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBWXJiZpJWxGBynqLwqe4mAlcWI1kqeLkg&libraries=geometry,marker"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <script
        src="https://developers.google.com/maps/documentation/javascript/examples/markerclusterer/markerclusterer.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

</head>

<body>
    <div class="content">
        <div id="map"></div>
        <div id="path-panel">
            <div id="path-header">
                <div id="path-count">Path Items: 0</div>
                <div id="path-time"></div>
            </div>
            <div id="path-panel-contents"></div>
            <div id="control-panel">
                <button onclick="exportPath()"><span class="material-symbols-outlined">save</span><span>Export
                        Path</span></button>
                <input type="file" id="file-input" style="display: none" />
                <button onclick="importPath()"><span class="material-symbols-outlined">upload_file</span><span>Import
                        Path</span></button>
                <input type="text" id="maps-count" />
                <button onclick="generateAndOpenGoogleMapsLink()" onmouseenter="previewGoogleMapsLinkMarkers()" onmouseleave="clearPreviewGoogleMapsLinkMarkers()"><span
                        class="material-symbols-outlined">explore</span><span>Google Maps (Up to Current)</span></button>
                <button onclick="generateAndOpenGoogleMapsLink(true)" onmouseenter="previewGoogleMapsLinkMarkers()" onmouseleave="clearPreviewGoogleMapsLinkMarkers()"><span
                        class="material-symbols-outlined">u_turn_left</span><span>Google Maps (Up to Current, Reversed)</span></button>
                <button onclick="generateAndOpenGoogleMapsLinks()"><span
                        class="material-symbols-outlined">travel_explore</span><span>Google Maps (All)</span></button>
                <button onclick="reversePath()"><span class="material-symbols-outlined">autorenew</span><span>Reverse
                        Path</span></button>
                <button onclick="toggleTrafficLayer()"><span class="material-symbols-outlined">traffic</span><span>Toggle
                        Traffic</span></button>
                <button onclick="toggleRoutes()"><span class="material-symbols-outlined">route</span><span>Toggle
                        Routes</span></button>

                <!-- <hr>
                <button onclick="switchMapType()"><span class="material-symbols-outlined">autorenew</span><span>Switch
                        Map Type</span></button> -->

            </div>
        </div>
    </div>
    <script src="map.js"></script>
</body>

</html>
